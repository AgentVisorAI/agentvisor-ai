[package]
name = "av-state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Atomic counters, token velocity, rate limits, action budgets (StateStore)"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
av-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }

[features]
default = []
# Redis Cluster backend (brief §8); requires a live server, contract tests gated on AV_REDIS_URL.
redis = ["dep:redis", "dep:r2d2"]

[dependencies.redis]
version = "0.27"
optional = true
default-features = false
features = ["script", "r2d2", "cluster"]

[dependencies.r2d2]
workspace = true
optional = true

[dev-dependencies]
proptest = { workspace = true }
av-core = { workspace = true }

[lints]
workspace = true
