[package]
name = "av-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The drop-in agent harness: inline proxy, hot path pipeline, workers, reconciler"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "agentvisord"
path = "src/main.rs"

[features]
default = []
redis = ["av-state/redis"]
nats = ["av-bridge/nats"]
kafka = ["av-bridge/kafka"]
onnx = ["av-loopdetect/onnx"]
qdrant = ["av-loopdetect/qdrant"]
# Round-6 (hunt5 portability F3): passthrough for the S3 cold tier —
# without it no shipped artifact (docker builds `--features full`)
# could reach an `s3://` cold_uri at all; the boot error then named an
# object_store-internal feature instead of a cargo feature an operator
# could act on.
cold-store-aws = ["av-bridge/cold-store-aws"]
service-binding = []
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-http", "dep:async-trait", "dep:tracing-opentelemetry", "reqwest/blocking"]
full = ["redis", "nats", "kafka", "onnx", "qdrant", "cold-store-aws", "otel"]
# Compiles the permissive `HarnessConfig::for_tests` constructor
# (config_testkit.rs). NEVER part of `full` or `default`: production
# artifacts must not carry a config constructor whose posture disables
# identity, schema, and scope enforcement. Integration tests and
# benches receive it through the self dev-dependency below.
test-support = []

[dependencies]
av-core = { workspace = true }
av-events = { workspace = true }
av-atif = { workspace = true }
av-receipts = { workspace = true }
av-state = { workspace = true }
av-bridge = { workspace = true }
av-identity = { workspace = true }
av-compress = { workspace = true }
av-loopdetect = { workspace = true }
av-redact = { workspace = true }
av-sandbox = { workspace = true, features = ["wasm"] }
tokio = { workspace = true }
axum = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
tower = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
zeroize = { workspace = true }
jsonwebtoken = { workspace = true }
base64 = { workspace = true }
serde_urlencoded = "0.7"

[dependencies.opentelemetry]
version = "0.32"
optional = true
default-features = false
features = ["trace"]

[dependencies.opentelemetry_sdk]
version = "0.32"
optional = true
default-features = false
features = ["trace"]

[dependencies.opentelemetry-otlp]
version = "0.32"
optional = true
default-features = false
features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls"]

[dependencies.opentelemetry-http]
version = "0.32"
optional = true
default-features = false

[dependencies.async-trait]
version = "0.1"
optional = true

[dependencies.tracing-opentelemetry]
version = "0.33"
optional = true
default-features = false

[dev-dependencies]
# Self dev-dependency: enables `test-support` for this crate's own
# integration tests and benches (they are separate crates compiled
# WITHOUT cfg(test), so a bare #[cfg(test)] gate would hide
# `for_tests` from them). Path-only, so it is stripped on publish.
av-harness = { path = ".", features = ["test-support"] }
tempfile = { workspace = true }
criterion = { workspace = true }
jsonwebtoken = { workspace = true }
base64 = { workspace = true }
# In-memory span exporter for the tenant content-span tests (`otel` builds).
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "testing"] }

[[bench]]
name = "hot_path"
harness = false

[lints]
workspace = true
