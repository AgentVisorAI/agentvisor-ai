[package]
name = "av-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MCP tool-call sandbox: JSON-RPC intercept, schema validation, policies, action budgets"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
av-core = { workspace = true }
av-state = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
jsonschema = { workspace = true }

[features]
default = []
# WebAssembly policy modules via wasmtime (brief §8 sandboxing engine).
# NOT default: wasmtime is a large dependency (~10 MB compiled) and
# many consumers of av-sandbox only need the schema / policy / budget
# gates. Enable explicitly with `features = ["wasm"]` when needed;
# `av-harness` opts in unconditionally because its `Sandbox::new`
# path exercises WASM policies against every MCP tool call.
wasm = ["dep:wasmtime"]

[dependencies.wasmtime]
workspace = true
optional = true

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
