[package]
name = "av-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "avctl: keygen, receipt verify, ATIF validate, bridge provision, loadgen"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "avctl"
path = "src/main.rs"

# Round-51 §8.10: passthrough features so `--features full` (and the
# per-backend features) apply to avctl exactly as they do to
# agentvisord — avctl's pre-flight checks (config-validate, doctor)
# report what its own build can run, so the two binaries must be
# buildable with matching feature sets in one invocation.
[features]
default = []
redis = ["av-harness/redis"]
nats = ["av-harness/nats"]
kafka = ["av-harness/kafka"]
onnx = ["av-harness/onnx"]
qdrant = ["av-harness/qdrant"]
cold-store-aws = ["av-harness/cold-store-aws"]
otel = ["av-harness/otel"]
full = ["redis", "nats", "kafka", "onnx", "qdrant", "cold-store-aws", "otel"]

[dependencies]
av-core = { workspace = true }
av-events = { workspace = true }
av-atif = { workspace = true }
av-receipts = { workspace = true }
av-bridge = { workspace = true }
av-harness = { workspace = true }
clap = { workspace = true }
rpassword = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
reqwest = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
