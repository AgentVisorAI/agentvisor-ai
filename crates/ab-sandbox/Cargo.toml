[package]
name = "ab-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MCP tool-call sandbox: JSON-RPC intercept, schema validation, policies, action budgets"

[dependencies]
ab-core = { workspace = true }
ab-state = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
jsonschema = { workspace = true }

[features]
default = ["wasm"]
# WebAssembly policy modules via wasmtime (brief §8 sandboxing engine).
wasm = ["dep:wasmtime"]

[dependencies.wasmtime]
workspace = true
optional = true

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
