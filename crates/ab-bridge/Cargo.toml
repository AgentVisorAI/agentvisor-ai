[package]
name = "ab-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Portable event bridge: EventBus trait, embedded file-backed broker, manifest provisioning"

[dependencies]
ab-core = { workspace = true }
ab-events = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }

[features]
default = []
# NATS JetStream connector (edge/single-node alternative, brief Module F).
nats = ["dep:async-nats", "dep:tokio", "dep:futures"]
# Kafka-wire connector (works against Redpanda, brief's reference broker).
kafka = ["dep:rskafka", "dep:tokio"]

[dependencies.async-nats]
version = "0.38"
optional = true

[dependencies.rskafka]
version = "0.5"
optional = true

[dependencies.tokio]
workspace = true
optional = true

[dependencies.futures]
workspace = true
optional = true

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
