[package]
name = "ab-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Portable event bridge: EventBus trait, embedded file-backed broker, manifest provisioning"

[dependencies]
ab-core = { workspace = true }
ab-events = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
jsonschema = { workspace = true }

[features]
default = []
# Two-phase authenticated cold-tier archive (object_store-backed).
cold-store = [
    "dep:object_store",
    "dep:url",
    "dep:hmac",
    "dep:sha2",
    "dep:hex",
    "dep:ab-receipts",
    "dep:tokio",
    "dep:futures",
]
# NATS JetStream connector (edge/single-node alternative, brief Module F).
nats = ["dep:async-nats", "dep:tokio", "dep:futures", "cold-store"]
# Kafka-wire connector (works against Redpanda, brief's reference broker).
kafka = ["dep:rskafka", "dep:rdkafka", "dep:tokio", "dep:chrono", "cold-store"]

[dependencies.async-nats]
version = "0.50"
optional = true

[dependencies.rskafka]
version = "0.5"
optional = true

[dependencies.rdkafka]
workspace = true
optional = true

[dependencies.chrono]
version = "0.4"
optional = true
default-features = false
features = ["clock"]

[dependencies.tokio]
workspace = true
optional = true

[dependencies.futures]
workspace = true
optional = true

[dependencies.object_store]
workspace = true
optional = true
features = ["fs"]

[dependencies.url]
workspace = true
optional = true

[dependencies.hmac]
workspace = true
optional = true

[dependencies.sha2]
workspace = true
optional = true

[dependencies.hex]
workspace = true
optional = true

[dependencies.ab-receipts]
workspace = true
optional = true

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
