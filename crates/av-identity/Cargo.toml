[package]
name = "av-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ephemeral Non-Human Identity validation: short-lived JWTs, scope inheritance, delegation"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
av-core = { workspace = true }
av-events = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
jsonwebtoken = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }
# Workload identity: X.509 chain and signature verification for RFC 7523
# assertions (Cloud Foundry instance identity). Both are already in the
# dependency tree through rustls.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "alloc", "std"] }
rustls-pki-types = { version = "1", features = ["alloc"] }

[dev-dependencies]
proptest = { workspace = true }
av-core = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
