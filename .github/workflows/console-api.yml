# CI for the hosted console (docs/app/) + its backend server (server/).
# Runs on every push/PR: Rust changes can alter the evidence consumed by the
# console, so the daemon-to-console regression must also cover those changes.
name: Console + API

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: console-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: read-only. See ci.yml for rationale.
permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Frontend — static SPA at docs/app/. No build step; just syntax-check
  # every JS file and verify the entry HTML references what it should.
  # ────────────────────────────────────────────────────────────────────
  console-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # R225 F4: same rationale as ci.yml — don't persist
          # GITHUB_TOKEN in .git/config while `npm ci` runs.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Syntax-check every JS file
        run: |
          for f in docs/app/*.js; do
            echo "→ $f"
            node --check "$f"
          done
      - name: Encrypted backup failure and cleanup regressions
        run: |
          python3 scripts/test-postgres-backup.py
          python3 scripts/test-postgres-backup-drill.py
      - name: Container startup lifecycle
        run: node --test server/ci/container-entrypoint.test.mjs
      - name: Verify MOCK_MODE flag present in config
        # r57 extracted the inline MOCK_MODE script from index.html to
        # config.js so a strict CSP (script-src 'self') can be enforced.
        run: |
          grep -q 'window.MOCK_MODE' docs/app/config.js
          grep -q 'src="config.js"' docs/app/index.html
      - name: Verify datasource + app scripts loaded
        run: |
          grep -q 'src="datasource.js"' docs/app/index.html
          grep -q 'src="app.js"' docs/app/index.html
          grep -q 'src="crash-guard.js"' docs/app/index.html
      - name: Verify pitch demo is preserved at /app/pitch/
        run: |
          test -f docs/app/pitch/index.html
          test -f docs/app/pitch/console.js
          test -f docs/app/pitch/console.css

  # ────────────────────────────────────────────────────────────────────
  # Backend — Fastify + Prisma + Postgres. Type-check, install, migrate,
  # then run the Python smoke suite that exercises the full HTTP surface
  # and the Node E2E that drives the ApiDataSource adapter.
  # ────────────────────────────────────────────────────────────────────
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentvisor
          POSTGRES_PASSWORD: devpw
          POSTGRES_DB: agentvisor
          # Round-112 TZ guard: run the database in a non-UTC zone so
          # any naive-timestamp vs timestamptz comparison (the class
          # behind the zeroed /overview series and the 4.5h-stalled
          # webhook retries, #377) regresses loudly — mixed casts go
          # through the SESSION TimeZone, which only bites when the DB
          # default isn't UTC.
          TZ: America/New_York
          PGTZ: America/New_York
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentvisor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://agentvisor:devpw@127.0.0.1:5432/agentvisor
      JWT_SECRET: ci_only_secret_at_least_32_bytes_of_entropy_here_ok
      ALLOWED_ORIGINS: http://127.0.0.1:8787
      PORT: "8985"
      # Round-112 TZ guard, server half: Node runs in a THIRD zone so
      # server-local formatting can never masquerade as UTC in tests
      # (runner is UTC, DB is New York, server is Tokyo).
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # R225 F4: same rationale as ci.yml.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install (with devDependencies)
        working-directory: server
        env:
          # Force dev deps even though we set NODE_ENV=production at runtime;
          # without this npm ci drops @types/node + tsx and typecheck fails.
          NODE_ENV: development
        run: npm ci --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build daemon and CLI for console integration
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo build --locked -p av-harness --bin agentvisord -p av-cli --bin avctl
      - name: Prisma generate
        working-directory: server
        run: npx prisma generate
      - name: Typecheck
        working-directory: server
        run: npx tsc --noEmit
      - name: Database aliases and production URL startup regressions
        working-directory: server
        run: node --test ci/startup-env.test.mjs
      - name: Multi-instance logout and bounded stream recovery regressions
        working-directory: server
        run: npm run build && node --import tsx --test ci/multi-instance.test.mjs ci/bus-query-recovery.test.mjs ci/recovery-drill.test.mjs
      - name: Local identity provider, SMTP, and password reset contracts
        working-directory: server
        run: node --import tsx --test ci/external-auth.test.mjs
      - name: Real database outage and two-instance stream recovery
        working-directory: server
        timeout-minutes: 4
        env:
          # The service image is already present. The drill creates a
          # separate container and never resets the job's service DB.
          PG_IMAGE: postgres:16-alpine
          TMPDIR: ${{ runner.temp }}
        run: node scripts/recovery-drill.mjs
      - name: Preserve console recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-recovery-evidence
          path: |
            ${{ runner.temp }}/av-console-recovery-*/report.json
            ${{ runner.temp }}/av-console-recovery-*/api-*.log
          if-no-files-found: ignore
      - name: Migrate DB
        working-directory: server
        run: npx prisma migrate deploy
      - name: Start API
        working-directory: server
        env:
          NODE_ENV: production
          # R175 F1 fail-fasts production boots left on the localhost
          # APP_BASE_URL default. CI runs prod mode against 127.0.0.1
          # but never exercises the link-generation flows (reset/invite
          # emails, OAuth redirect_uri, WebAuthn rpID), so the real
          # public origin satisfies the guard without changing what the
          # smoke/e2e suites hit.
          APP_BASE_URL: https://agentvisorai.me
          # Prod mode fail-fasts without a mailer (by design — silently
          # swallowing password resets is the wrong failure mode). The
          # SmtpMailer constructs lazily so a dummy URL satisfies boot;
          # the only mail path CI hits is the fire-and-forget welcome
          # email whose failure is caught + logged, never surfaced.
          SMTP_URL: smtp://ci:ci@127.0.0.1:2525
        run: |
          npx tsx src/index.ts &
          echo $! > /tmp/api.pid
          for _ in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8985/healthz > /dev/null; then break; fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8985/healthz
      - name: Backend API smoke (Python)
        run: python3 server/ci/smoke.py
      - name: Backend E2E (Node fetch through ApiDataSource)
        run: node server/ci/e2e.mjs
      # R284: browser-truth E2E. The Node E2E can never catch what only
      # a browser enforces — the meta CSP (connect-src silently blocked
      # every self-hosted API_BASE until R284), cookie credential flow,
      # CORS + X-Requested-With, and the error copy a human actually
      # sees in a toast. Serve a patched console copy (the exact edits
      # server/README.md tells a self-hoster to make) and drive
      # signup → deployment → duplicate-409 toast → key reveal → audit
      # → signout/login in headless Chromium.
      - name: Prepare self-hosted console copy
        run: |
          # Mirror the production topology: the SPA lives at /app/ and
          # reaches ../logo.png at the site root (a flat copy of
          # docs/app alone 404s the brand mark + favicon).
          mkdir -p /tmp/console-root
          cp -R docs/app /tmp/console-root/app
          cp docs/logo.png /tmp/console-root/logo.png
          # Test the same pinned minification recipe used by Pages.
          (cd docs/app && npm ci --no-audit --no-fund)
          for script in app datasource tour; do
            docs/app/node_modules/.bin/terser "docs/app/$script.js" \
              --compress passes=2 --mangle --keep-fnames --keep-classnames \
              --output "/tmp/console-root/app/$script.js"
          done
          sed -i 's/window.MOCK_MODE = true;/window.MOCK_MODE = false;/' /tmp/console-root/app/config.js
          sed -i 's#window.API_BASE = "";#window.API_BASE = "http://127.0.0.1:8985";#' /tmp/console-root/app/config.js
          sed -i 's#connect-src '\''self'\'' https://api.agentvisorai.me#connect-src '\''self'\'' http://127.0.0.1:8985#' /tmp/console-root/app/index.html
          grep -q 'MOCK_MODE = false' /tmp/console-root/app/config.js
          grep -q 'connect-src .self. http://127.0.0.1:8985' /tmp/console-root/app/index.html
          (cd /tmp/console-root && python3 -m http.server 8787 >/dev/null 2>&1 &)
          for _ in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8787/app/config.js > /dev/null; then break; fi
            sleep 0.5
          done
      - name: Install Playwright Chromium
        working-directory: server
        run: npx playwright install --with-deps chromium
      - name: SAML discovery, outage, and recovery in the browser
        working-directory: server
        timeout-minutes: 2
        env:
          CONSOLE_DOCS_ROOT: /tmp/console-root
        run: node ci/saml-browser-e2e.mjs
      - name: Audit pagination and stream recovery in the minified console
        working-directory: server
        timeout-minutes: 2
        env:
          CONSOLE_DOCS_ROOT: /tmp/console-root
        run: node --test ci/datasource-recovery.test.mjs
      # Includes failed logout visibility, resumed SSE, and successful
      # logout retry. The deliberate 503 is confined to that assertion.
      - name: Browser E2E including logout failure and retry
        working-directory: server
        env:
          SPA_ORIGIN: http://127.0.0.1:8787/app
          API_BASE: http://127.0.0.1:8985
        run: node ci/browser-e2e.mjs
      - name: Browser quarantine evidence regression
        working-directory: server
        env:
          SPA_ORIGIN: http://127.0.0.1:8787/app
          API_BASE: http://127.0.0.1:8985
        run: node scripts/quarantine-drill.mjs
      - name: Real daemon crash evidence reaches the console
        working-directory: server
        env:
          TMPDIR: ${{ runner.temp }}
          API_BASE: http://127.0.0.1:8985
          AGENTVISORD: ${{ github.workspace }}/target/debug/agentvisord
          AVCTL: ${{ github.workspace }}/target/debug/avctl
        run: node scripts/daemon-console-drill.mjs
      - name: Preserve daemon startup failure logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-daemon-startup-logs
          path: ${{ runner.temp }}/av-crash-*/daemon-boot.log
          if-no-files-found: ignore
      # This 15-second load test measures /healthz only, using 20
      # connections without a request-rate cap. It requires p99 <= 250 ms,
      # at least 50 requests/second, and zero errors or non-2xx responses.
      # It does not test database workloads or authenticated rate limits.
      - name: Load test (autocannon → /healthz)
        working-directory: server
        run: |
          # R129 F1: use the version pinned in server/package.json
          # + package-lock.json. Prior shape ran
          # `npx --yes autocannon@8.0.0` — top-level pin OK, but the
          # transitive graph resolved with ^ on every CI run. A
          # compromised transitive publish would execute in the same
          # job step that has access to JWT_SECRET, POSTGRES_PASSWORD,
          # the running local API, and GITHUB_TOKEN. Direct sibling
          # to R128 F3 (terser). `npm ci` at line 101 already
          # installed autocannon into server/node_modules; invoke
          # the local binary so integrity is enforced from the
          # lockfile.
          ./node_modules/.bin/autocannon \
            --duration 15 \
            --connections 20 \
            --pipelining 1 \
            --json \
            http://127.0.0.1:8985/healthz \
            > /tmp/loadtest.json
          node -e '
            const r = JSON.parse(require("fs").readFileSync("/tmp/loadtest.json", "utf8"));
            const errors = r.errors + r.timeouts + r["non2xx"];
            const p99ms = r.latency.p99;
            const rps = r.requests.average;
            console.log("Load test:", { rps, p99ms, errors });
            if (errors > 0) { console.error("FAIL: non-2xx or errors > 0"); process.exit(1); }
            if (p99ms > 250) { console.error("FAIL: p99 > 250 ms"); process.exit(1); }
            if (rps < 50)   { console.error("FAIL: throughput below 50 rps"); process.exit(1); }
            console.log("PASS");
          '
      - name: Stop API
        if: always()
        run: |
          kill "$(cat /tmp/api.pid)" 2>/dev/null || true

  # ────────────────────────────────────────────────────────────────────
  # Docker image — verify the multi-stage Dockerfile builds and runs.
  # Uses buildx cache so this stays fast on repeat runs.
  # ────────────────────────────────────────────────────────────────────
  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # R225 F4: same rationale as ci.yml — docker build runs
          # arbitrary base-image + Dockerfile steps, so token
          # persistence to .git/config is a needless attack surface.
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: server
          push: false
          load: true
          tags: agentvisor-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify production migrations, API, health, and database recovery
        timeout-minutes: 10
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 scripts/container-smoke.py --console-image agentvisor-api:ci
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install authentication fixture dependencies
        working-directory: server
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Authentication fixture cleanup regressions
        working-directory: server
        run: node --test ci/external-auth-drill.test.mjs
      - name: Verify packaged PostgreSQL notification recovery
        timeout-minutes: 3
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:uid=65532,gid=65532,mode=0700 \
            --cap-drop ALL --security-opt no-new-privileges \
            --env BUS_TEST_DIST=1 \
            --mount "type=bind,src=$GITHUB_WORKSPACE/server/ci,dst=/app/ci,readonly" \
            agentvisor-api:ci --test /app/ci/bus-query-recovery.test.mjs
      - name: Verify packaged replicas recover from a real database outage
        timeout-minutes: 4
        working-directory: server
        env:
          CONSOLE_RECOVERY_IMAGE: agentvisor-api:ci
          # Reuse the exact PostgreSQL image loaded by container-smoke.py.
          PG_IMAGE: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          TMPDIR: ${{ runner.temp }}
        run: node scripts/recovery-drill.mjs
      - name: Verify packaged authentication against PostgreSQL and private providers
        timeout-minutes: 10
        working-directory: server
        env:
          CONSOLE_AUTH_IMAGE: agentvisor-api:ci
          AUTH_DRILL_OUTPUT_PARENT: ${{ runner.temp }}
        # Reuse the exact image built above. The script copies its current
        # helper and temporary TLS files through Docker's API, then removes
        # only containers/networks with its own unique ownership label.
        run: node scripts/external-auth-drill.mjs
      - name: Verify shared SAML ceremonies across replicas and restarts
        timeout-minutes: 10
        working-directory: server
        env:
          CONSOLE_SAML_IMAGE: agentvisor-api:ci
          SAML_DRILL_OUTPUT_PARENT: ${{ runner.temp }}
        run: node scripts/saml-shared-drill.mjs
      - name: Preserve container verification logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-container-logs
          path: |
            ${{ runner.temp }}/av-container-smoke-*/*.log
            ${{ runner.temp }}/av-container-smoke-*/native-runtime.json
            ${{ runner.temp }}/av-auth-*/*.log
            ${{ runner.temp }}/av-auth-*/report.json
            ${{ runner.temp }}/av-saml-shared-*/*.log
            ${{ runner.temp }}/av-saml-shared-*/report.json
            ${{ runner.temp }}/av-console-recovery-*/*.log
            ${{ runner.temp }}/av-console-recovery-*/report.json
          if-no-files-found: ignore

  encrypted-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PostgreSQL 18 encrypted archive and restore drill
        run: python3 scripts/postgres-backup-test.py --output-dir "${{ runner.temp }}/backup-results"
      - name: Preserve backup drill evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: encrypted-backup-drill
          path: ${{ runner.temp }}/backup-results
          if-no-files-found: ignore
          retention-days: 14
