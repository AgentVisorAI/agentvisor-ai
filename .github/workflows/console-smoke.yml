name: Console smoke

# Runs Playwright drills against the deployed console after the Pages
# workflow has published. Catches regressions like:
#   * A settings tab going empty because mock data got moved.
#   * A JS error introduced by a routing change.
#   * A route returning 4xx from the Pages CDN.
#   * Mobile viewport breaking with horizontal scroll.
#   * A11y regressions on any route.
#
# Runs on push to main (post-deploy) + a nightly cron so a broken
# CDN cache doesn't sit unnoticed for a week.

on:
  workflow_run:
    workflows: ["Docs"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily
  workflow_dispatch:

# R78 F3 (landed R78): explicit workflow-scope permissions.
# Every other workflow in .github/workflows/ declares
# `contents: read` — this one didn't, defaulting to whatever
# the repo's `default_workflow_permissions` setting is (which
# on older repos is `write`). This workflow also grew a large
# transitive dependency tree in the same commit that added it
# (Lighthouse + chrome-launcher via `npm ci` on server/, plus
# `npx playwright install --with-deps chromium`), so the least-
# privilege posture matters: a supply-chain compromise in any
# of those deps would otherwise reach `workflow_run`-triggered
# and cron-triggered runs with a write-scoped GITHUB_TOKEN
# and no PR-review gate. `contents: read` is enough for
# `actions/checkout` + `npm ci`; nothing this workflow does
# writes back to the repo.
permissions:
  contents: read

concurrency:
  group: console-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    # Only run if the Docs workflow (which builds+deploys Pages)
    # actually succeeded — a failed deploy doesn't need us re-testing
    # the old bits.
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server deps (includes Playwright)
        working-directory: server
        run: npm ci

      - name: Install Playwright browsers
        working-directory: server
        run: npx playwright install --with-deps chromium

      - name: Wait 10s for CDN cache to warm
        run: sleep 10

      - name: Live SPA smoke
        working-directory: server
        env:
          SITE: https://agentvisorai.me/app/
        run: node scripts/live-site-smoke.mjs

      - name: Mobile viewport smoke
        working-directory: server
        env:
          SITE: https://agentvisorai.me/app/
        run: node scripts/mobile-smoke.mjs

      - name: A11y audit (axe-core)
        working-directory: server
        env:
          SITE: https://agentvisorai.me/app/
        run: node scripts/a11y-audit.mjs

      - name: Receipt verification round-trip
        working-directory: server
        env:
          SITE: https://agentvisorai.me/app/
        run: node scripts/receipt-verify-drill.mjs

      - name: /verify page drill
        working-directory: server
        env:
          SITE: https://agentvisorai.me/
        run: node scripts/verify-page-drill.mjs

      - name: Interactive features drill (tour, attack demo, onboarding, billing, reset)
        working-directory: server
        env:
          SITE: https://agentvisorai.me/app/
        run: node scripts/interactive-drill.mjs

      - name: Shareable receipt URL drill
        working-directory: server
        env:
          SITE: https://agentvisorai.me/app/
        run: node scripts/share-receipt-drill.mjs

      - name: CSP + security-headers drill
        working-directory: server
        env:
          SITE: https://agentvisorai.me/
        run: node scripts/csp-drill.mjs

      - name: Lighthouse audit (perf + a11y + best-practices)
        working-directory: server
        env:
          SITE: https://agentvisorai.me/app/
        run: node scripts/lighthouse-audit.mjs
