name: Console smoke

# Runs Playwright drills against the deployed console after the Pages
# workflow has published. Catches regressions like:
#   * A settings tab going empty because mock data got moved.
#   * A JS error introduced by a routing change.
#   * A route returning 4xx from the Pages CDN.
#   * Mobile viewport breaking with horizontal scroll.
#   * A11y regressions on any route.
#
# Runs on push to main (post-deploy) + a nightly cron so a broken
# CDN cache doesn't sit unnoticed for a week.

on:
  workflow_run:
    workflows: ["Docs"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily
  workflow_dispatch:

# R78 F3 (landed R78): explicit workflow-scope permissions.
# Every other workflow in .github/workflows/ declares
# `contents: read` — this one didn't, defaulting to whatever
# the repo's `default_workflow_permissions` setting is (which
# on older repos is `write`). This workflow also grew a large
# transitive dependency tree in the same commit that added it
# (Lighthouse + chrome-launcher via `npm ci` on server/, plus
# `npx playwright install --with-deps chromium`), so the least-
# privilege posture matters: a supply-chain compromise in any
# of those deps would otherwise reach `workflow_run`-triggered
# and cron-triggered runs with a write-scoped GITHUB_TOKEN
# and no PR-review gate. `contents: read` is enough for
# `actions/checkout` + `npm ci`; nothing this workflow does
# writes back to the repo.
permissions:
  contents: read

concurrency:
  group: console-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    # Only run if the Docs workflow (which builds+deploys Pages)
    # actually succeeded — a failed deploy doesn't need us re-testing
    # the old bits.
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    # 30 min: install (~2-4) + suites (~8 on the nightly 3-engine
    # matrix) + up to 15 of CDN-convergence polling. The old 22-min
    # cap predates the convergence wait.
    timeout-minutes: 30
    steps:
      # R106 F2: SHA-pin third-party actions (matches R29 F2 discipline
      # applied elsewhere). Prior console-smoke.yml used mutable
      # tag references (@v4), which a repo takeover of the actions
      # org or a compromised publisher could rewrite to inject
      # attacker code into this workflow — impact bounded by
      # `permissions: contents: read` but the job runs `npm ci` and
      # hits production console with Playwright, so a compromised
      # checkout could inject test-time data-exfil.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server deps (includes Playwright)
        working-directory: server
        run: npm ci

      - name: Install Playwright browsers
        working-directory: server
        run: npx playwright install --with-deps chromium

      # Nightly/dispatch only: WebKit + Firefox add ~2 min of installs,
      # too slow for every deploy but exactly right for the cron.
      - name: Install WebKit + Firefox (nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: server
        run: npx playwright install --with-deps webkit firefox

      - name: Wait for the CDN to serve THIS deploy
        # The Pages CDN takes up to ~10 minutes to converge after a
        # deploy. Smokes that started inside that window ran the NEW
        # drill against the OLD payload and false-failed (documented
        # stale-CDN class — it burned three manual re-dispatches).
        # pages.yml stamps the deployed commit into /build.txt; on
        # workflow_run events poll it (cache-busted) until it matches
        # the Docs run's head_sha — a CDN that never converges inside
        # 15 minutes is a real deploy problem, fail loudly. Schedule/
        # dispatch runs aren't racing any particular deploy AND the
        # tip sha may legitimately never be stamped (pages.yml has a
        # paths: filter, so non-site commits don't deploy) — those
        # just assert the marker is reachable.
        env:
          EVENT: ${{ github.event_name }}
          EXPECTED: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ "$EVENT" != "workflow_run" ]; then
            got="$(curl -fsS "https://agentvisorai.me/build.txt?cb=$RANDOM" || true)"
            if [ -n "$got" ]; then echo "site alive (build ${got:0:12}…)"; exit 0; fi
            echo "::error::build.txt unreachable — site down or marker missing"
            exit 1
          fi
          echo "waiting for build.txt == $EXPECTED"
          for i in $(seq 1 90); do
            got="$(curl -fsS "https://agentvisorai.me/build.txt?cb=$RANDOM$i" 2>/dev/null || true)"
            if [ "$got" = "$EXPECTED" ]; then
              echo "CDN converged after $((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::CDN never converged to $EXPECTED (last saw: ${got:-nothing}) after 15 minutes"
          exit 1

      - name: Live SPA smoke
        working-directory: server
        env:
          SITE: https://agentvisorai.me/app/
        run: node scripts/live-site-smoke.mjs

      - name: Mobile viewport smoke
        working-directory: server
        env:
          SITE: https://agentvisorai.me/app/
        run: node scripts/mobile-smoke.mjs

      - name: A11y audit (axe-core)
        working-directory: server
        env:
          SITE: https://agentvisorai.me/app/
        run: node scripts/a11y-audit.mjs

      - name: Receipt verification round-trip
        working-directory: server
        env:
          SITE: https://agentvisorai.me/app/
        run: node scripts/receipt-verify-drill.mjs

      - name: /verify page drill
        working-directory: server
        env:
          SITE: https://agentvisorai.me/
        run: node scripts/verify-page-drill.mjs

      - name: Interactive features drill (tour, attack demo, onboarding, billing, reset)
        working-directory: server
        env:
          SITE: https://agentvisorai.me/app/
        run: node scripts/interactive-drill.mjs

      - name: Full investor-flow rehearsal (landing → tour → verify → attack → receipt → signup → reset)
        working-directory: server
        env:
          SITE: https://agentvisorai.me/
        run: node scripts/full-flow-rehearsal.mjs

      - name: Full investor-flow rehearsal — phone/QR path (iPhone profile)
        working-directory: server
        env:
          SITE: https://agentvisorai.me/
          PROFILE: phone
        run: node scripts/full-flow-rehearsal.mjs

      - name: Full investor-flow rehearsal — venue-wifi latency (300–700ms jitter)
        working-directory: server
        env:
          SITE: https://agentvisorai.me/
          SLOW: "1"
        run: node scripts/full-flow-rehearsal.mjs

      - name: Cross-engine feature matrix (nightly — Chromium/WebKit/Firefox)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: server
        env:
          SITE: https://agentvisorai.me/app/
        run: node scripts/engine-matrix.mjs

      - name: Shareable receipt URL drill
        working-directory: server
        env:
          SITE: https://agentvisorai.me/app/
        run: node scripts/share-receipt-drill.mjs

      - name: CSP + security-headers drill
        working-directory: server
        env:
          SITE: https://agentvisorai.me/
        run: node scripts/csp-drill.mjs

      - name: Lighthouse audit (perf + a11y + best-practices)
        working-directory: server
        env:
          SITE: https://agentvisorai.me/app/
        run: node scripts/lighthouse-audit.mjs
