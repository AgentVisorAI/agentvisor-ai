name: Release pin bump

# Round-91 dress-rehearsal lesson: v0.1.0-rc.2 shipped and the
# installer kept handing out rc.1 for an hour — the install.sh pin is
# a manual step nobody remembers. This workflow lands the bump on main
# automatically whenever a release is published (and is dispatchable
# for testing / catch-up). It commits directly (org policy forbids
# Actions-created PRs); because GITHUB_TOKEN pushes don't trigger
# other workflows (anti-recursion), it then dispatches the Pages
# deploy explicitly so the live installer actually serves the bump.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to pin (e.g. v0.1.0-rc.2)"
        required: true

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump docs/install.sh pin
        id: bump
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -eu
          VERSION="${TAG#v}"
          CURRENT=$(sed -n 's/^AV_VERSION="\${AV_VERSION:-\(.*\)}"$/\1/p' docs/install.sh)
          echo "current pin: $CURRENT → release: $VERSION"
          if [ -z "$CURRENT" ]; then
            echo "::error::could not parse the AV_VERSION pin out of docs/install.sh — pattern drifted"
            exit 1
          fi
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "pin already current; nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i "s/${CURRENT//./\\.}/$VERSION/g" docs/install.sh
          sh -n docs/install.sh
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Commit bump to main
        if: steps.bump.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/install.sh
          git commit -m "install.sh: pin v$VERSION (automated release bump)"
          # Race guard: main may have moved since checkout — rebase and retry.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::could not push the pin bump after 3 attempts"
          exit 1
      - name: Deploy the installer (Pages)
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN pushes never trigger pages.yml on their own.
          gh workflow run pages.yml --ref main
