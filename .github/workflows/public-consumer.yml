name: Public consumer

# Certifies the OUTSIDER experience nightly: everything a stranger
# does after reading the public README, run exactly as they would run
# it — fresh clone of the PUBLIC export (never this monorepo), the
# installer script from the live site, the printed commands verbatim.
#
# Every step here is a promise the product prints somewhere (console
# snippets, install.sh, the public README). R270–R272 found all three
# rings broken by inspection-only review: a DNS host that never
# existed, a CLI subcommand that never existed, a crates.io package
# that never existed. This workflow makes the class regress loudly.
#
# Nightly (not per-push): the chain costs ~15 min of Rust builds and
# tests the EXPORTED repo + the LIVE site, both of which lag pushes.

on:
  schedule:
    - cron: "30 7 * * *" # 07:30 UTC daily, after the nightly smoke
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-consumer
  cancel-in-progress: true

jobs:
  # Round 93: the installer must work on ANY os. Real runners cover
  # linux x64/arm64 + macOS arm64/x64; containers cover old-glibc
  # distros and musl (where rc.2's gnu binaries died silently).
  installer-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: curl | sh from the live site, then smoke
        run: |
          set -euo pipefail
          curl -fsSL "https://agentvisorai.me/install.sh?cb=$RANDOM" -o /tmp/install.sh
          AV_INSTALL_DIR="$HOME/av-bin" sh /tmp/install.sh
          "$HOME/av-bin/agentvisord" --version
          "$HOME/av-bin/avctl" --version

  installer-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "debian:12", "alpine:3.20"]
    container: ${{ matrix.image }}
    steps:
      - name: Install curl
        run: |
          if command -v apt-get >/dev/null; then apt-get update -q && apt-get install -y -q curl ca-certificates; fi
          if command -v apk >/dev/null; then apk add -q curl; fi
      - name: curl | sh from the live site, then smoke
        run: |
          set -eu
          # $$ not $RANDOM: this step runs under dash on debian/ubuntu.
          curl -fsSL "https://agentvisorai.me/install.sh?cb=$$" -o /tmp/install.sh
          AV_INSTALL_DIR=/opt/av sh /tmp/install.sh
          /opt/av/agentvisord --version
          /opt/av/avctl --version

  # Round 95: the cargo fallback is the path every platform WITHOUT a
  # prebuilt target hits (riscv64/ppc64le/s390x/armv7/386 …). It builds
  # from the PUBLIC export, which can rot independently of this repo.
  installer-source-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: AV_INSTALL_SOURCE=1 curl | sh, then smoke
        run: |
          set -euo pipefail
          curl -fsSL "https://agentvisorai.me/install.sh?cb=$RANDOM" -o /tmp/install.sh
          AV_INSTALL_SOURCE=1 sh /tmp/install.sh
          "$HOME/.cargo/bin/agentvisord" --version
          "$HOME/.cargo/bin/avctl" --version

  outsider-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # No checkout of THIS repo on purpose: outsiders don't have it.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: The installer the console prints (curl | sh)
        run: |
          set -euo pipefail
          curl -fsSL "https://agentvisorai.me/install.sh?cb=$RANDOM" -o /tmp/install.sh
          head -1 /tmp/install.sh | grep -qx '#!/bin/sh'
          sh /tmp/install.sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: The binaries the installer promised
        run: |
          set -euo pipefail
          agentvisord --version
          avctl --version

      - name: The setup wizard the installer prints (piped, headless)
        run: |
          set -euo pipefail
          mkdir -p /tmp/wizard && cd /tmp/wizard
          # Answers: preset 1 (OpenAI) → dummy key → no console → don't start.
          printf '1\nsk-outsider-dummy-key-123\nn\nn\n' | avctl setup
          test -f "$HOME/.agentvisor/agentvisor.toml"
          # Key stays out of the config and lands 0600 in keys/.
          ! grep -q sk-outsider-dummy "$HOME/.agentvisor/agentvisor.toml"
          [ "$(stat -c %a "$HOME/.agentvisor/keys/openai.key")" = "600" ]
          avctl config-validate "$HOME/.agentvisor/agentvisor.toml"

      - name: The quickstart the README prints (init → doctor → start → proxy)
        env:
          OPENAI_API_KEY: sk-public-consumer-dummy
        run: |
          set -euo pipefail
          mkdir -p /tmp/quickstart && cd /tmp/quickstart
          avctl init --preset openai
          avctl config-validate agentvisor.toml
          avctl doctor --offline
          AV_LISTEN=127.0.0.1:18484 avctl start &
          DAEMON=$!
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18484/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18484/health | grep -q '"status":"ok"'
          avctl health --url http://127.0.0.1:18484
          # A real request must go THROUGH the proxy to the upstream;
          # the provider's own auth error (not a local crash) proves
          # the pipe. Upstream 401 -> curl exit 22 with -f; drop -f
          # and assert on the body instead.
          BODY=$(curl -sS -X POST http://127.0.0.1:18484/v1/chat/completions \
            -H "Content-Type: application/json" -H "X-Session-Id: consumer-1" \
            -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"hi"}]}')
          echo "$BODY" | grep -qi "api key" || { echo "proxy did not reach the upstream: $BODY"; exit 1; }
          kill "$DAEMON"

      - name: The verifier the /verify/ page offers as the CLI fallback
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/AgentVisorAI/agentvisor /tmp/pub
          curl -fsS "https://agentvisorai.me/verify/sample-receipt.json?cb=$RANDOM" -o /tmp/sample-receipt.json
          node /tmp/pub/tools/verify-receipt.mjs /tmp/sample-receipt.json

      - name: The docker line the README prints (compose build from the export)
        run: |
          set -euo pipefail
          cd /tmp/pub
          docker compose -f docker/docker-compose.minimal.yml config -q
          docker compose -f docker/docker-compose.minimal.yml build

      - name: The image must RUN, not just build (boot → gate → SIGTERM drain)
        run: |
          set -euo pipefail
          # Round-102/103: agentvisord is PID 1 in this image (no init
          # shim) — prove SIGTERM lands, the drain finishes fast, and
          # the shutdown finalizer seals the still-open session.
          docker run -d --name avd -p 127.0.0.1:8484:8484 agentvisor-ai:local
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8484/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8484/health | grep -q '"status":"ok"'
          # $60 payout: schema caps amount_usd at 50 → blocked at the
          # gate, no upstream needed. Session left UNCLOSED on purpose.
          BODY=$(curl -sS -X POST http://127.0.0.1:8484/mcp \
            -H "Content-Type: application/json" -H "x-av-session: ci-sigterm" \
            -d '{"jsonrpc":"2.0","id":"1","method":"tools/call","params":{"name":"payout","arguments":{"amount_usd":60,"recipient":"acme"}}}')
          echo "$BODY" | grep -q '"error"' || { echo "gate did not block: $BODY"; exit 1; }
          T0=$(date +%s)
          docker stop -t 180 avd
          ELAPSED=$(( $(date +%s) - T0 ))
          echo "docker stop took ${ELAPSED}s"
          [ "$ELAPSED" -lt 60 ] || { echo "drain exceeded 60s — SIGTERM not honored?"; exit 1; }
          [ "$(docker inspect avd --format '{{.State.ExitCode}}')" = "0" ]
          docker cp avd:/app/spool/atif/receipts /tmp/receipts
          ls /tmp/receipts/*.json
          grep -Eq '"blocked":[[:space:]]*1' /tmp/receipts/*.json
          docker rm avd
