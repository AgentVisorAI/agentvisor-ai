name: Public consumer

# Certifies the OUTSIDER experience nightly: everything a stranger
# does after reading the public README, run exactly as they would run
# it — fresh clone of the PUBLIC export (never this monorepo), the
# installer script from the live site, the printed commands verbatim.
#
# Every step here is a promise the product prints somewhere (console
# snippets, install.sh, the public README). R270–R272 found all three
# rings broken by inspection-only review: a DNS host that never
# existed, a CLI subcommand that never existed, a crates.io package
# that never existed. This workflow makes the class regress loudly.
#
# Nightly (not per-push): the chain costs ~15 min of Rust builds and
# tests the EXPORTED repo + the LIVE site, both of which lag pushes.

on:
  schedule:
    - cron: "30 7 * * *" # 07:30 UTC daily, after the nightly smoke
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-consumer
  cancel-in-progress: true

jobs:
  outsider-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # No checkout of THIS repo on purpose: outsiders don't have it.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: The installer the console prints (curl | sh)
        run: |
          set -euo pipefail
          curl -fsSL "https://agentvisorai.me/install.sh?cb=$RANDOM" -o /tmp/install.sh
          head -1 /tmp/install.sh | grep -qx '#!/bin/sh'
          sh /tmp/install.sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: The binaries the installer promised
        run: |
          set -euo pipefail
          agentvisord --version
          avctl --version

      - name: The quickstart the README prints (init → doctor → start → proxy)
        env:
          OPENAI_API_KEY: sk-public-consumer-dummy
        run: |
          set -euo pipefail
          mkdir -p /tmp/quickstart && cd /tmp/quickstart
          avctl init --preset openai
          avctl config-validate agentvisor.toml
          avctl doctor --offline
          AV_LISTEN=127.0.0.1:18484 avctl start &
          DAEMON=$!
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18484/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18484/health | grep -q '"status":"ok"'
          avctl health --url http://127.0.0.1:18484
          # A real request must go THROUGH the proxy to the upstream;
          # the provider's own auth error (not a local crash) proves
          # the pipe. Upstream 401 -> curl exit 22 with -f; drop -f
          # and assert on the body instead.
          BODY=$(curl -sS -X POST http://127.0.0.1:18484/v1/chat/completions \
            -H "Content-Type: application/json" -H "X-Session-Id: consumer-1" \
            -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"hi"}]}')
          echo "$BODY" | grep -qi "api key" || { echo "proxy did not reach the upstream: $BODY"; exit 1; }
          kill "$DAEMON"

      - name: The verifier the /verify/ page offers as the CLI fallback
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/AgentVisorAI/agentvisor /tmp/pub
          curl -fsS "https://agentvisorai.me/verify/sample-receipt.json?cb=$RANDOM" -o /tmp/sample-receipt.json
          node /tmp/pub/tools/verify-receipt.mjs /tmp/sample-receipt.json

      - name: The docker line the README prints (compose build from the export)
        run: |
          set -euo pipefail
          cd /tmp/pub
          docker compose -f docker/docker-compose.minimal.yml config -q
          docker compose -f docker/docker-compose.minimal.yml build
