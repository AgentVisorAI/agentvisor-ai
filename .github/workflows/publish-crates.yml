name: Publish crates.io

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish --dry-run only, no upload"
        required: false
        default: "true"
        type: string

permissions:
  contents: read

concurrency:
  # A pushed tag is immutable; keep the group so a manual dispatch does
  # not race a tagged release.
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish workspace crates
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      # Pin every third-party action by commit SHA (round-29 F2). The
      # publish workflow uploads to crates.io using a token secret — a
      # compromised action tag could exfiltrate it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: publish-${{ github.ref_name }}
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev

      # Verify the tag version matches the workspace version so a
      # `git tag vX.Y.Z` pointing at a workspace still on the OLD
      # version does not silently republish under the old number.
      # workflow_dispatch runs skip this check (no tag).
      - name: Verify tag matches workspace version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          workspace_version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = //;s/"//g')
          if [ "$tag_version" != "$workspace_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME (=$tag_version) does not match workspace version $workspace_version"
            echo "Update workspace.package.version in Cargo.toml before tagging."
            exit 1
          fi

      # Dry-run the whole workspace before any real upload. `cargo
      # publish --workspace --dry-run` (native since cargo 1.90, and the
      # toolchain above pins 1.97.1) topologically orders the crates and
      # runs each verification build against the LOCAL copies of
      # yet-unpublished siblings — exactly the semantics a fresh release
      # needs. The previous hand-rolled per-crate loop used
      # `cargo package --no-verify`, but even --no-verify resolves
      # `{ path, version }` dependencies against the crates.io INDEX, so
      # every crate except av-core failed the gate on precisely the
      # releases it existed to protect (reproduced locally: "no matching
      # package named `av-core` found"). The gate could never pass
      # before the first real publish.
      - name: Dry-run publish (whole workspace)
        run: cargo publish --workspace --dry-run --allow-dirty

      # workflow_dispatch with dry_run=true stops here — the manual
      # trigger's purpose is to smoke-test the workflow itself before
      # a real tag is pushed. Only tag pushes (or dispatch with
      # dry_run=false) proceed to actual publish.
      - name: Should publish?
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.dry_run }}" = "false" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping upload — dry-run only."
          fi

      # Publish the whole workspace. `cargo publish --workspace` handles
      # topological ordering AND waits for each crate to land in the
      # index before publishing its dependents — the two things the old
      # hand-rolled loop did manually. Rate-limit friendly: crates.io
      # allows ~10 new versions/min/token, and the built-in index wait
      # paces the 12-crate cadence naturally.
      - name: Publish
        if: steps.gate.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set. Add it under Settings → Secrets → Actions."
            exit 1
          fi
          # --allow-dirty because the workflow runs against the tag
          # tree which cargo considers "dirty" versus its own
          # packaged tree diff — nothing is actually modified in the
          # working copy. --no-verify: the dry-run gate above already
          # ran every verification build; rebuilding all 12 crates a
          # second time only adds ~20 min between "first crate live"
          # and "last crate live" (a broken half-published window).
          cargo publish --workspace --allow-dirty --no-verify
