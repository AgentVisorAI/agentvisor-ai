# Nightly Postgres backup — off-provider escape hatch.
#
# Why this exists
#   Neon (and every other managed PG we might use) already has PITR +
#   snapshots. This workflow adds a SECOND, off-provider copy so we can
#   restore even if the primary provider vanishes overnight — same
#   guarantee that keeps the whole stack unlocked from any single vendor.
#
#   The dump is standard `pg_dump --format=custom`, restorable to any
#   Postgres-compatible target with `pg_restore`. No proprietary format,
#   no proprietary tool.
#
# Retention
#   30 days on GitHub-hosted artifact storage (free for public repos).
#   Longer horizons should push to S3 / R2 / any object store.
#
# Configuration
#   Requires a repository secret `BACKUP_DATABASE_URL` pointing at a
#   read-only replica or the primary, AND `BACKUP_PASSPHRASE` to
#   encrypt the dump (gpg AES-256) before upload. If neither is set
#   the job is a no-op (fork-friendly). If the database URL is set
#   without a passphrase the job FAILS: this repository is public,
#   and artifacts on public repos are downloadable by any GitHub
#   user — uploading a plaintext production dump (password hashes,
#   API keys, webhook secrets, PII) would publish the database.
#
# Restore
#   gpg --decrypt agentvisor-<ts>.dump.gpg > agentvisor-<ts>.dump
#   pg_restore --no-owner --dbname "$TARGET_URL" agentvisor-<ts>.dump
name: Nightly PG backup

on:
  schedule:
    # 04:17 UTC — off the top-of-hour rush that free-tier providers
    # sometimes throttle. Cron in GitHub Actions is best-effort but
    # very reliable for once-a-day cadence.
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Guard on BACKUP_DATABASE_URL
        id: guard
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ]; then
            echo "BACKUP_DATABASE_URL not set; skipping." >&2
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_DATABASE_URL is set but BACKUP_PASSPHRASE is not." >&2
            echo "::error::This repo is PUBLIC — artifacts are downloadable by any GitHub user." >&2
            echo "::error::Refusing to upload a plaintext production dump. Set BACKUP_PASSPHRASE." >&2
            exit 1
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install postgres-client-18
        if: steps.guard.outputs.run == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          # Neon runs Postgres 18 (server_version 18.x) and pg_dump refuses
          # any server NEWER than itself ("aborting because of server
          # version mismatch") — client 16 broke the very first real run.
          sudo apt-get install -y --no-install-recommends postgresql-client-18

      - name: pg_dump (custom format, compressed, encrypted)
        if: steps.guard.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          ts=$(date -u +%Y%m%d-%H%M)
          out="agentvisor-${ts}.dump"
          # The runner PREINSTALLS postgresql-client-16 and Debian's
          # pg_wrapper keeps /usr/bin/pg_dump pointing at it even after
          # client-18 lands — the previous fix installed 18 but still
          # executed 16.15. Call the versioned binary directly.
          /usr/lib/postgresql/18/bin/pg_dump \
            --format=custom \
            --compress=9 \
            --no-owner \
            --no-privileges \
            --file "$out" \
            "$DATABASE_URL"
          # Encrypt before upload: artifacts on this PUBLIC repo are
          # downloadable by any GitHub user, so the plaintext dump
          # must never leave the runner. gpg ships on ubuntu runners.
          gpg --batch --symmetric --cipher-algo AES256 \
            --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --output "$out.gpg" "$out"
          rm -f "$out"
          # Show size + a short manifest so the artifact is greppable.
          ls -lh "$out.gpg"
          echo "BACKUP_FILE=$out.gpg" >> "$GITHUB_ENV"

      - name: Upload backup artifact (30-day retention)
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pg-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
          # Compression level 0 — pg_dump already used gzip -9 internally.
          compression-level: 0
