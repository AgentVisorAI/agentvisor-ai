# Nightly Postgres backup — off-provider escape hatch.
#
# Purpose and retention
#   This adds an encrypted copy outside the database provider. Recovery
#   still requires access to GitHub artifacts, the vaulted passphrase,
#   and a compatible target. Provider snapshots/PITR are separate controls.
#   The custom pg_dump archive uses standard PostgreSQL tools.
#   Artifacts are retained for 30 days; longer retention needs a separately
#   configured destination and a tested retrieval path. Storage charges
#   depend on the repository's plan and usage.
#
# Configuration
#   Set repository secrets BACKUP_DATABASE_URL and BACKUP_PASSPHRASE.
#   A missing database URL skips the job. A configured URL without a
#   passphrase fails. Only verified ciphertext is uploaded, regardless of
#   repository visibility; a plaintext archive can contain credentials
#   and captured personal data.
#
# Restore
#   Follow docs/RUNBOOK.md's isolated restore procedure. Use PostgreSQL 18
#   pg_restore against a separate empty PostgreSQL 18 database. The example
#   uses private PGSERVICEFILE/PGPASSFILE files and --dbname=service=...,
#   never a password-bearing URI in process arguments. It decrypts into
#   a private temporary directory and removes plaintext on exit.
#   Require --single-transaction --exit-on-error; do not ignore errors
#   from an older server or restore client. These checks do not establish
#   compatibility with older PostgreSQL major versions.
#
#   Keep the passphrase in an accessible vault outside GitHub: repository
#   secrets cannot be read back for recovery. The current isolated drill
#   verifies encryption and restoration but does not retrieve production
#   artifacts or verify access to the production vault.
name: Nightly PG backup

on:
  schedule:
    # 04:17 UTC avoids the top of the hour. Scheduled Actions are
    # best-effort; monitor backup freshness separately.
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Guard on BACKUP_DATABASE_URL
        id: guard
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ]; then
            echo "BACKUP_DATABASE_URL not set; skipping." >&2
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_DATABASE_URL is set but BACKUP_PASSPHRASE is not." >&2
            echo "::error::This repo is PUBLIC — artifacts are downloadable by any GitHub user." >&2
            echo "::error::Refusing to upload a plaintext production dump. Set BACKUP_PASSPHRASE." >&2
            exit 1
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.run == 'true'
        with:
          persist-credentials: false

      - name: Install postgres-client-18
        if: steps.guard.outputs.run == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          # Neon runs Postgres 18 (server_version 18.x) and pg_dump refuses
          # any server NEWER than itself ("aborting because of server
          # version mismatch") — client 16 broke the very first real run.
          sudo apt-get install -y --no-install-recommends postgresql-client-18

      - name: Create and verify encrypted archive
        id: archive
        if: steps.guard.outputs.run == 'true'
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          umask 077
          # Versioned clients avoid Debian's pg_wrapper selecting an older client.
          python3 scripts/postgres-backup.py \
            --pg-dump /usr/lib/postgresql/18/bin/pg_dump \
            --pg-restore /usr/lib/postgresql/18/bin/pg_restore \
            --output-dir "$RUNNER_TEMP/agentvisor-backup" \
            --timeout-seconds 900 > "$RUNNER_TEMP/backup-manifest.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'backup-manifest.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('file=' + result['file'] + '\n')
          print('Verified encrypted backup:', result['bytes'], 'bytes; SHA-256:', result['sha256'])
          PYTHON

      - name: Upload backup artifact (30-day retention)
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pg-backup-${{ github.run_id }}
          path: ${{ steps.archive.outputs.file }}
          retention-days: 30
          if-no-files-found: error
          # Compression level 0 — pg_dump already used gzip -9 internally.
          compression-level: 0
