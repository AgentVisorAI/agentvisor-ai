name: Docs

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "docs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# R116 F1: least-privilege at workflow root; per-job overrides
# below grant the specific scopes each job needs. Prior shape
# gave the whole workflow (including the build matrix that runs
# cargo doc against transitive crates.io deps + build.rs surface,
# plus 3× npx --yes terser@5 fresh unpinned npm fetches)
# pages: write + id-token: write — id-token: write can mint OIDC
# federation tokens for external clouds. Only the deploy job
# (actions/deploy-pages) actually needs those two scopes. Sibling
# discipline to R115 F3 on release.yml.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      # Round-29 F2: pin every third-party action by commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Pinned in rust-toolchain.toml; this ensures the rustdoc lints
          # match the CI build.
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - name: Build rustdoc
        env:
          # Match the CI `Docs` job in ci.yml so broken intra-doc links are hard errors.
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D warnings"
        # `--all-features` mirrors the CI Docs job so the published docs cover
        # every feature-gated backend (redis, nats, kafka, onnx, qdrant, otel).
        # Requires the ubuntu-latest runner to have libcurl4-openssl-dev for
        # the transitive rdkafka-sys build under the `kafka` feature.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
          cargo doc --workspace --no-deps --all-features
      - name: Assemble Pages site
        # The published site is a hand-authored non-technical landing page
        # (`docs/index.html` + `docs/style.css`) with the rustdoc build
        # served underneath at `/api/`. Non-technical operators land on
        # the plain-English page; library authors follow the "API docs"
        # link.
        run: |
          site="$RUNNER_TEMP/pages"
          mkdir -p "$site/api"
          # Move the rustdoc output under /api. `-T` avoids nesting when
          # /api already exists.
          cp -a target/doc/. "$site/api/"
          # A rustdoc build leaves no index at target/doc/; write one so
          # /api/ itself is not a directory listing.
          if [ ! -f "$site/api/index.html" ]; then
            printf '%s\n' \
              '<!DOCTYPE html>' \
              '<meta charset="utf-8">' \
              '<title>AgentVisor AI — API documentation</title>' \
              '<meta http-equiv="refresh" content="0; url=av_harness/index.html">' \
              '<link rel="canonical" href="av_harness/index.html">' \
              '<p><a href="av_harness/index.html">Continue to <code>av_harness</code></a></p>' \
              > "$site/api/index.html"
          fi
          # Copy the landing files LAST so they always win over anything
          # rustdoc might have written at the root.
          cp docs/index.html "$site/index.html"
          cp docs/style.css "$site/style.css"
          cp docs/logo.png "$site/logo.png"
          cp docs/social-preview.png "$site/social-preview.png"
          # Product console — the multi-tenant SaaS app.
          #
          # Minify app.js + datasource.js + tour.js with terser (installed
          # via `npm ci` in docs/app for supply-chain pinning, see R128 F3
          # below). Cloudflare Pages and GitHub Pages both handle
          # response-time gzip / brotli negotiation server-side against
          # the client's Accept-Encoding, so we don't ship precompressed
          # .gz artifacts here — the wire cost is ~30 KB per pageview
          # regardless. Minification does NOT touch index.html so the
          # boot-time crash-card script stays readable.
          mkdir -p "$site/app"
          cp docs/app/index.html "$site/app/"
          cp docs/app/styles.css "$site/app/"
          # Boot-time config + crash guard extracted from index.html so
          # that a strict CSP (`script-src 'self'`) can be enforced
          # without allowing 'unsafe-inline'.
          cp docs/app/config.js "$site/app/"
          cp docs/app/crash-guard.js "$site/app/"
          # Minify JS. keep_classnames + keep_fnames stay on so the
          # in-app error boundary can still show a legible stack.
          #
          # R128 F3: pin terser via docs/app/package.json +
          # package-lock.json and install with `npm ci`. Prior
          # shape ran `npx --yes terser@5` three times — fresh
          # unpinned npm fetches on every build, so a single
          # compromised terser 5.x publish would inject arbitrary
          # code into the minified SPA served under
          # credentials: "include" against the API cookie: whole-
          # tenant account-takeover primitive. R116 F1's own
          # comment named this as motivation to shrink workflow
          # scope but the fetch itself was never pinned. `npm ci`
          # enforces the exact tree in package-lock.json (with
          # integrity hashes) so a hostile republish would break
          # the build loudly, not run silently.
          (cd docs/app && npm ci --silent)
          TERSER_BIN=docs/app/node_modules/.bin/terser
          "$TERSER_BIN" docs/app/app.js \
            --compress passes=2 --mangle --keep-fnames --keep-classnames \
            -o "$site/app/app.js"
          "$TERSER_BIN" docs/app/datasource.js \
            --compress passes=2 --mangle --keep-fnames --keep-classnames \
            -o "$site/app/datasource.js"
          "$TERSER_BIN" docs/app/tour.js \
            --compress passes=2 --mangle --keep-fnames --keep-classnames \
            -o "$site/app/tour.js"
          echo "SPA sizes (raw → minified):"
          ls -la docs/app/app.js "$site/app/app.js"
          ls -la docs/app/datasource.js "$site/app/datasource.js"
          # The linear pitch walkthrough — investor demo links + video
          # transcripts still reference the scripted flow at /app/pitch/.
          mkdir -p "$site/app/pitch"
          cp docs/app/pitch/index.html "$site/app/pitch/"
          cp docs/app/pitch/console.css "$site/app/pitch/"
          cp docs/app/pitch/console.js "$site/app/pitch/"
          # Public /pitch/ investor landing page — the 44-second video
          # + CTAs. Self-hosted MP4 + JPG so it works under strict CSP.
          mkdir -p "$site/pitch"
          cp docs/pitch/index.html "$site/pitch/"
          cp docs/pitch/pitch.css "$site/pitch/"
          cp docs/pitch/pitch.mp4 "$site/pitch/"
          cp docs/pitch/pitch-muted.mp4 "$site/pitch/"
          cp docs/pitch/poster.jpg "$site/pitch/"
          cp docs/pitch/social.jpg "$site/pitch/"
          cp docs/pitch/tour.mp4 "$site/pitch/"
          cp docs/pitch/tour-poster.jpg "$site/pitch/"
          # Caption tracks (WebVTT) for both videos — a11y (WCAG 1.2)
          cp docs/pitch/pitch.vtt "$site/pitch/"
          cp docs/pitch/tour.vtt "$site/pitch/"
          cp docs/pitch/qr-demo.svg "$site/pitch/"
          # Short-link aliases (/mockup, /demo) + branded 404. GitHub
          # Pages ignores the Cloudflare-style _redirects file, so the
          # aliases are static meta-refresh stubs, and 404.html is the
          # Pages-native custom error page.
          mkdir -p "$site/mockup" "$site/demo"
          cp docs/mockup/index.html "$site/mockup/"
          cp docs/demo/index.html "$site/demo/"
          cp docs/404.html "$site/404.html"
          # Custom-domain marker for GitHub Pages. Without a CNAME file in
          # the published artifact, Pages resets the configured custom
          # domain on each deploy.
          cp docs/CNAME "$site/CNAME"
          # RFC 9116 disclosure endpoint — must be preserved at the origin
          # root so security scanners can find it.
          mkdir -p "$site/.well-known"
          cp docs/.well-known/security.txt "$site/.well-known/"
          # Legal pages — Terms + Privacy stubs so footer links resolve.
          mkdir -p "$site/legal"
          cp docs/legal/terms.html "$site/legal/"
          cp docs/legal/privacy.html "$site/legal/"
          # Public /verify page — drop a receipt, watch it verify
          # offline via Web Crypto. Standalone HTML + one JSON
          # sample; no build step needed. Inline script + style
          # extracted to verify.js + verify.css for strict CSP.
          mkdir -p "$site/verify"
          cp docs/verify/index.html "$site/verify/"
          cp docs/verify/verify.js "$site/verify/"
          cp docs/verify/verify.css "$site/verify/"
          cp docs/verify/sample-receipt.json "$site/verify/"
          # Pages ships as a plain branch in the public site repo — keep
          # Jekyll out of the way (files starting with _ etc.).
          touch "$site/.nojekyll"
          # Publish the assembled directory.
          rm -rf target/doc
          mv "$site" target/doc
      # The monorepo is private and the org is on the free plan, so
      # GitHub Pages cannot serve from here. The assembled site is
      # force-pushed (content snapshot, no history) to the PUBLIC
      # AgentVisorAI/agentvisorai.github.io repo, whose Pages serves
      # agentvisorai.me. Auth: write-scoped deploy key held as an
      # Actions secret here; the public repo holds only built
      # artifacts, never source.
      - name: Push site to the public Pages repo
        env:
          DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/site_key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/site_key -o StrictHostKeyChecking=accept-new"
          cd target/doc
          git init -q -b main
          git config user.name "agentvisor-deploy"
          git config user.email "deploy@agentvisorai.me"
          git add -A
          git commit -qm "Deploy site from agentvisor-ai@${GITHUB_SHA}"
          git push -f git@github.com:AgentVisorAI/agentvisorai.github.io.git main
          rm -f "$RUNNER_TEMP/site_key"
