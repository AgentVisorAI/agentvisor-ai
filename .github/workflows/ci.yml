name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Round-29 F2: pin every third-party action by commit SHA (with
      # the moving pointer in a trailing comment for Renovate/
      # Dependabot updates). A moving tag like `@v4` or `@stable` can
      # be silently rewritten by the action publisher (or by an
      # attacker who compromises the publisher — see the March 2025
      # tj-actions/changed-files supply-chain incident). Pinning to
      # a SHA makes the CI job byte-reproducible and immune to
      # tag-rewrite attacks that would otherwise run attacker code
      # with the workflow's `contents: write` / OIDC token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Install native build dependencies
        # rdkafka-sys (via the `kafka` feature) builds librdkafka from source
        # and requires libcurl headers; wasmtime with cranelift is otherwise
        # self-contained but its assembler paths appreciate a modern cmake.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Start live contract services
        run: docker compose -f docker/docker-compose.yml up -d --wait redpanda redis qdrant nats
      - name: Fetch pinned MiniLM artifacts
        run: |
          mkdir -p /tmp/agentbridge-minilm
          curl -fL --retry 3 -o /tmp/agentbridge-minilm/model.onnx https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/1110a243fdf4706b3f48f1d95db1a4f5529b4d41/onnx/model.onnx
          curl -fL --retry 3 -o /tmp/agentbridge-minilm/tokenizer.json https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/1110a243fdf4706b3f48f1d95db1a4f5529b4d41/tokenizer.json
          echo "6fd5d72fe4589f189f8ebc006442dbb529bb7ce38f8082112682524616046452  /tmp/agentbridge-minilm/model.onnx" | sha256sum -c -
          echo "be50c3628f2bf5bb5e3a7f17b1f74611b2561a3a27eeab05e5aa30f411572037  /tmp/agentbridge-minilm/tokenizer.json" | sha256sum -c -
      - name: Test
        env:
          AB_REDIS_URL: redis://127.0.0.1:6379
          AB_KAFKA_BROKER: 127.0.0.1:19092
          AB_NATS_URL: nats://127.0.0.1:4222
          AB_QDRANT_URL: http://127.0.0.1:6333
          AB_ONNX_MODEL_PATH: /tmp/agentbridge-minilm/model.onnx
          AB_ONNX_TOKENIZER_PATH: /tmp/agentbridge-minilm/tokenizer.json
        run: |
          cargo test --workspace
          cargo test --workspace --all-features
      - name: Release SLA
        env:
          AB_REDIS_URL: redis://127.0.0.1:6379
          AB_KAFKA_BROKER: 127.0.0.1:19092
        run: |
          cargo test -p ab-harness --release --features full --test sla sla_core_metrics -- --ignored --nocapture
          ulimit -n 65536
          RUN_HEAVY_PERF=1 AB_SLA_CONNECTIONS=10000 cargo test -p ab-harness --release --features full --test sla sla_10k_streaming_connections -- --ignored --nocapture
      - name: Feature matrix
        run: |
          cargo check --workspace --no-default-features
          cargo check --workspace --all-features
      - name: Docs
        run: RUSTDOCFLAGS="-D rustdoc::broken_intra_doc_links -D warnings" cargo doc --workspace --all-features --no-deps
      - name: Schemas and examples
        run: make schema-check
      - name: Harbor ATIF interoperability
        env:
          HARBOR_TELEMETRY: "off"
        run: |
          # Round-29 F3: pin transitive PyPI deps to exact versions.
          # `pydantic>=2.11.7` and `shortuuid>=1.0.13` would otherwise
          # pull whatever is latest at CI time — including a PyPI-
          # hijacked release published after this file was authored.
          # The CI job holds GITHUB_TOKEN with write scope for the
          # workflow's duration; a supply-chained Python interpreter
          # could steal it. Exact-pinning kills the version-drift
          # window; a follow-up `--require-hashes` requirements.txt
          # would close the hash-collision residual.
          python -m pip install --disable-pip-version-check \
            "pydantic==2.11.7" "pydantic-core==2.33.2" "shortuuid==1.0.13" \
            "annotated-types==0.7.0" "typing-extensions==4.12.2" \
            "typing-inspection==0.4.1"
          python -m pip install --disable-pip-version-check --no-deps "git+https://github.com/harbor-framework/harbor.git@e5e46809a973c91d90a207fcaa232ab8ff89acaf"
          AB_HARBOR_INTEROP_OUT=/tmp/agentbridge-atif.json cargo test -p ab-harness full_chat_close_and_promotion_flow
          python -m harbor.utils.trajectory_validator /tmp/agentbridge-atif.json --no-validate-images
      - name: Compose
        run: docker compose -f docker/docker-compose.yml config >/dev/null
      - name: Container build
        run: docker compose -f docker/docker-compose.yml build agent-bridge
      - name: Stop live contract services
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
