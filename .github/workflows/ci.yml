name: CI

on:
  push:
    branches: [main]
    # Prose and deploy manifests have no CI-executed checks (the Docs
    # workflow owns the docs/ site build). Skipping them here saves the
    # full 30-60 min pipeline on docs-only commits.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "deploy/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "deploy/**"
      - "LICENSE"

# A superseded run of this pipeline costs 30-60 runner-minutes; always
# yield to the newer commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Round-29 F2: pin every third-party action by commit SHA (with
      # the moving pointer in a trailing comment for Renovate/
      # Dependabot updates). A moving tag like `@v4` or `@stable` can
      # be silently rewritten by the action publisher (or by an
      # attacker who compromises the publisher — see the March 2025
      # tj-actions/changed-files supply-chain incident). Pinning to
      # a SHA makes the CI job byte-reproducible and immune to
      # tag-rewrite attacks that would otherwise run attacker code
      # with the workflow's `contents: write` / OIDC token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Install native build dependencies
        # rdkafka-sys (via the `kafka` feature) builds librdkafka from source
        # and requires libcurl headers; wasmtime with cranelift is otherwise
        # self-contained but its assembler paths appreciate a modern cmake.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Start live contract services
        run: docker compose -f docker/docker-compose.yml up -d --wait redpanda redis qdrant nats
      - name: Fetch pinned MiniLM artifacts
        run: |
          mkdir -p /tmp/agentvisor-minilm
          curl -fL --retry 3 -o /tmp/agentvisor-minilm/model.onnx https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/1110a243fdf4706b3f48f1d95db1a4f5529b4d41/onnx/model.onnx
          curl -fL --retry 3 -o /tmp/agentvisor-minilm/tokenizer.json https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/1110a243fdf4706b3f48f1d95db1a4f5529b4d41/tokenizer.json
          echo "6fd5d72fe4589f189f8ebc006442dbb529bb7ce38f8082112682524616046452  /tmp/agentvisor-minilm/model.onnx" | sha256sum -c -
          echo "be50c3628f2bf5bb5e3a7f17b1f74611b2561a3a27eeab05e5aa30f411572037  /tmp/agentvisor-minilm/tokenizer.json" | sha256sum -c -
      - name: Test
        env:
          AV_REDIS_URL: redis://127.0.0.1:6379
          AV_KAFKA_BROKER: 127.0.0.1:19092
          AV_NATS_URL: nats://127.0.0.1:4222
          AV_QDRANT_URL: http://127.0.0.1:6333
          AV_ONNX_MODEL_PATH: /tmp/agentvisor-minilm/model.onnx
          AV_ONNX_TOKENIZER_PATH: /tmp/agentvisor-minilm/tokenizer.json
        run: |
          cargo test --workspace
          cargo test --workspace --all-features
      - name: Release SLA
        # The two release-profile SLA builds are the pipeline's most
        # expensive step (~15-20 min). Gate them to main pushes: PR runs
        # (mostly Dependabot) still get fmt/clippy/tests/feature-matrix/
        # docs/schemas/Harbor, and main re-validates the SLA on merge.
        if: github.event_name == 'push'
        env:
          AV_REDIS_URL: redis://127.0.0.1:6379
          AV_KAFKA_BROKER: 127.0.0.1:19092
          # Round-45: shared GitHub Actions runners have noisy
          # neighbours and observed 10k-streaming p95/p99 sits near
          # 4.5-5.1 ms / 7-9 ms, which trips the tight 5 ms / 8 ms
          # defaults roughly half the time. Loosen the CI gates by
          # ~50 % to account for runner variance; local dev keeps the
          # historic defaults unless the operator overrides.
          AV_SLA_STREAMING_P95_US: "7500"
          AV_SLA_STREAMING_P99_US: "12000"
        run: |
          cargo test -p av-harness --release --features full --test sla sla_core_metrics -- --ignored --nocapture
          ulimit -n 65536
          RUN_HEAVY_PERF=1 AV_SLA_CONNECTIONS=10000 cargo test -p av-harness --release --features full --test sla sla_10k_streaming_connections -- --ignored --nocapture
      - name: Feature matrix
        run: |
          cargo check --workspace --no-default-features
          cargo check --workspace --all-features
      - name: Docs
        run: RUSTDOCFLAGS="-D rustdoc::broken_intra_doc_links -D warnings" cargo doc --workspace --all-features --no-deps
      - name: Schemas and examples
        run: make schema-check
      - name: Harbor ATIF interoperability
        env:
          HARBOR_TELEMETRY: "off"
        run: |
          # Round-29 F3: pin transitive PyPI deps to exact versions.
          # `pydantic>=2.11.7` and `shortuuid>=1.0.13` would otherwise
          # pull whatever is latest at CI time — including a PyPI-
          # hijacked release published after this file was authored.
          # The CI job holds GITHUB_TOKEN with write scope for the
          # workflow's duration; a supply-chained Python interpreter
          # could steal it. Exact-pinning kills the version-drift
          # window; a follow-up `--require-hashes` requirements.txt
          # would close the hash-collision residual.
          python -m pip install --disable-pip-version-check \
            "pydantic==2.11.7" "pydantic-core==2.33.2" "shortuuid==1.0.13" \
            "annotated-types==0.7.0" "typing-extensions==4.12.2" \
            "typing-inspection==0.4.1"
          python -m pip install --disable-pip-version-check --no-deps "git+https://github.com/harbor-framework/harbor.git@e5e46809a973c91d90a207fcaa232ab8ff89acaf"
          AV_HARBOR_INTEROP_OUT=/tmp/agentvisor-atif.json cargo test -p av-harness full_chat_close_and_promotion_flow
          python -m harbor.utils.trajectory_validator /tmp/agentvisor-atif.json --no-validate-images
      - name: Compose
        run: docker compose -f docker/docker-compose.yml config >/dev/null
      - name: Container build
        # Release-profile in-container build (~10-20 min): main-only, same
        # rationale as the SLA gate. `Compose` above still validates the
        # compose file itself on every run.
        if: github.event_name == 'push'
        run: docker compose -f docker/docker-compose.yml build agentvisor-ai
      - name: Stop live contract services
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
