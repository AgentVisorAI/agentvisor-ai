name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - .github/workflows/deny.yml
  schedule:
    # Weekly on Monday 07:00 UTC — catches new advisories on unchanged code.
    - cron: "0 7 * * 1"

permissions:
  contents: read

concurrency:
  group: deny-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `advisories` catches unfixed RUSTSEC entries; the others enforce the
        # policy configured in `deny.toml`.
        check:
          - advisories
          - bans
          - licenses
          - sources
    steps:
      # Round-29 F2: pin every third-party action by commit SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check ${{ matrix.check }}
