name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - .github/workflows/deny.yml
  schedule:
    # Weekly on Monday 07:00 UTC — catches new advisories on unchanged code.
    - cron: "0 7 * * 1"

permissions:
  contents: read

concurrency:
  group: deny-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `advisories` catches unfixed RUSTSEC entries; the others enforce the
        # policy configured in `deny.toml`.
        check:
          - advisories
          - bans
          - licenses
          - sources
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.check }}
