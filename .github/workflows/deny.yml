name: Supply chain

on:
  push:
    branches: [main]
    # Dependency policy only changes when these change; code-only pushes
    # skip the gate (the weekly schedule still catches new advisories on
    # unchanged code).
    paths:
      - Cargo.toml
      - "crates/*/Cargo.toml"
      - Cargo.lock
      - deny.toml
      - .github/workflows/deny.yml
  pull_request:
    paths:
      - Cargo.toml
      - "crates/*/Cargo.toml"
      - Cargo.lock
      - deny.toml
      - .github/workflows/deny.yml
  schedule:
    # Weekly on Monday 07:00 UTC — catches new advisories on unchanged code.
    - cron: "0 7 * * 1"

permissions:
  contents: read

concurrency:
  group: deny-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      # Round-29 F2: pin every third-party action by commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One `check` invocation runs advisories, bans, licenses, and
      # sources together (each reported separately in the log) — a single
      # container spin-up instead of the former four-job matrix.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
