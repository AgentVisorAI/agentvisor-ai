# Build/test/scan jobs have read-only credentials, including on fork PRs.
# Only a successful main run can copy validated OCI bytes to GHCR. Candidate
# references are not deployment outputs; convenience tags move after every
# platform and required attestation passes. Fly receives the verified digest.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "docs/app/datasource.js"
      - "scripts/container-smoke.py"
      - "scripts/release-policy.py"
      - "scripts/test-release-policy.py"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "server/**"
      - "docs/app/datasource.js"
      - "scripts/container-smoke.py"
      - "scripts/release-policy.py"
      - "scripts/test-release-policy.py"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  console-checks:
    uses: ./.github/workflows/console-api.yml
    permissions:
      contents: read

  validate:
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["amd64"]' || '["amd64","arm64"]') }}
    # Each published architecture executes its own image natively.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"
      - name: Prepare private artifact directory
        run: echo "CANDIDATE=$RUNNER_TEMP/console-release-$ARCH" >> "$GITHUB_ENV"
      - name: Install OCI copy tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo ruby
          mkdir -p "$CANDIDATE"
      - name: Release boundary regression tests
        run: python3 scripts/test-release-policy.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build local OCI archive with attestations
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: server
          file: server/Dockerfile
          push: false
          # A local name gives BuildKit attestation subjects a manifest binding.
          tags: agentvisor-api:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=oci,dest=${{ env.CANDIDATE }}/image.oci.tar
          labels: |
            org.opencontainers.image.title=AgentVisor API
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=console-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=console-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
      - name: Validate the exported platform and run its API/startup checks
        run: python3 scripts/release-policy.py runtime --directory "$CANDIDATE" --arch "$ARCH"
      - name: Generate SPDX inventory of the tested image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: docker:agentvisor-api:release-test-${{ matrix.arch }}
          format: spdx-json
          output-file: ${{ env.CANDIDATE }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Preserve a complete unfiltered Trivy scan
        env:
          # Trivy 0.74.0; this index contains both native release architectures.
          TRIVY_IMAGE: aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker pull "$TRIVY_IMAGE" >/dev/null
          for attempt in 1 2 3; do
            if timeout 120 docker run --rm \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              "$TRIVY_IMAGE" image --download-db-only --no-progress; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            -v "$CANDIDATE:/reports" \
            "$TRIVY_IMAGE" image --image-src docker --platform "linux/$ARCH" \
              --scanners vuln --ignorefile /dev/null --list-all-pkgs \
              --format json --output /reports/trivy-full.json \
              --skip-db-update --no-progress "agentvisor-api:release-test-$ARCH"
      - name: Gate fixable HIGH/CRITICAL findings and seal the tested bytes
        run: python3 scripts/release-policy.py seal --directory "$CANDIDATE" --arch "$ARCH"
      - name: Preserve reports even when validation fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-evidence-${{ matrix.arch }}
          path: |
            ${{ env.CANDIDATE }}/*.json
            ${{ env.CANDIDATE }}/*.log
          if-no-files-found: warn
      - name: Transfer validated archive and its evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-release-${{ matrix.arch }}
          path: ${{ env.CANDIDATE }}/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  promote:
    needs: [validate, console-checks]
    if: >-
      github.ref == 'refs/heads/main' && !github.event.repository.fork &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image_ref: ${{ steps.promote.outputs.image_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select artifact download directory
        run: echo "CANDIDATES=$RUNNER_TEMP/candidates" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: console-release-*
          path: ${{ env.CANDIDATES }}
      - name: Verify both archives before registry login
        run: python3 scripts/release-policy.py verify --directory "$CANDIDATES"
      - name: Refuse a superseded main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$current" = "$GITHUB_SHA"
      - name: Install OCI copy tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login for promotion only
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy validated bytes and verify the complete multiarch index
        id: stage
        run: python3 scripts/release-policy.py stage --directory "$CANDIDATES"
      - name: Attest the checked multiarch index
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.stage.outputs.image }}
          subject-digest: ${{ steps.stage.outputs.digest }}
          push-to-registry: true
      - name: Attest the amd64 SPDX inventory
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.stage.outputs.image }}
          subject-digest: ${{ steps.stage.outputs.amd64_digest }}
          sbom-path: ${{ env.CANDIDATES }}/console-release-amd64/sbom.spdx.json
          push-to-registry: true
      - name: Attest the arm64 SPDX inventory
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.stage.outputs.image }}
          subject-digest: ${{ steps.stage.outputs.arm64_digest }}
          sbom-path: ${{ env.CANDIDATES }}/console-release-arm64/sbom.spdx.json
          push-to-registry: true
      - name: Promote deployable tags without rebuilding
        id: promote
        run: python3 scripts/release-policy.py promote --directory "$CANDIDATES"
      - name: Preserve promotion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-promotion
          path: |
            ${{ env.CANDIDATES }}/staged.json
            ${{ env.CANDIDATES }}/*.digest
          if-no-files-found: warn

  deploy-fly:
    needs: promote
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: production
      url: https://api.agentvisorai.me
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for FLY_API_TOKEN
        id: guard
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "FLY_API_TOKEN not configured; skipping deploy." >&2
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up flyctl
        if: steps.guard.outputs.should_deploy == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
      - name: Fly deploy the exact promoted digest
        if: steps.guard.outputs.should_deploy == 'true'
        working-directory: server
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          IMAGE_REF: ${{ needs.promote.outputs.image_ref }}
        run: fly deploy --image "$IMAGE_REF" --strategy rolling --wait-timeout 300
