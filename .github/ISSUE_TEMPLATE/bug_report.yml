name: Bug report
description: Report a defect in a released version of AgentBridge.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include the version you observed the
        bug on and the smallest reliable reproducer.

        **Security issues do not belong here.** Use the private advisory link
        on the issue-picker page (see `SECURITY.md`).
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `agent-bridge --version` or the release/commit you ran.
      placeholder: v0.1.0 (or 68e4d1b)
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Deployment shape
      options:
        - Single binary (embedded bridge, in-memory state)
        - Docker compose (minimal)
        - Docker compose (full reference stack)
        - Kubernetes
        - Other (describe below)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the exact error/log lines, not paraphrased.
      render: text
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Config snippets, curl invocations, and the smallest sequence that triggers the bug.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, kernel, container runtime, external backend versions (Redis, Kafka, NATS, Qdrant).
    validations:
      required: false
