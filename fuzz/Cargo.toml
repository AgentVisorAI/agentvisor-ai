[package]
name = "av-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
# Not in the workspace: cargo-fuzz manages its own dependency tree and
# needs a nightly toolchain, so keeping it out of the default workspace
# means `cargo build --workspace` stays on stable.

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

# `otel` is required: `bounded_attribute` fuzzes
# `av_harness::otel_content::bounded`, and that module only exists when
# the `otel` feature is on.
av-harness = { path = "../crates/av-harness", features = ["otel"] }
av-core = { path = "../crates/av-core" }
av-compress = { path = "../crates/av-compress" }
av-receipts = { path = "../crates/av-receipts" }
av-sandbox = { path = "../crates/av-sandbox" }
av-identity = { path = "../crates/av-identity" }

[[bin]]
name = "canonicalize_receipt_subject"
path = "fuzz_targets/canonicalize_receipt_subject.rs"
test = false
doc = false

[[bin]]
name = "parse_provider_chunk"
path = "fuzz_targets/parse_provider_chunk.rs"
test = false
doc = false

[[bin]]
name = "sse_frame_end"
path = "fuzz_targets/sse_frame_end.rs"
test = false
doc = false

[[bin]]
name = "parse_tool_call"
path = "fuzz_targets/parse_tool_call.rs"
test = false
doc = false

[[bin]]
name = "compress_invariants"
path = "fuzz_targets/compress_invariants.rs"
test = false
doc = false

[[bin]]
name = "redact_userinfo"
path = "fuzz_targets/redact_userinfo.rs"
test = false
doc = false

[[bin]]
name = "authzen_decision"
path = "fuzz_targets/authzen_decision.rs"
test = false
doc = false

[[bin]]
name = "scope_intersection"
path = "fuzz_targets/scope_intersection.rs"
test = false
doc = false

[[bin]]
name = "bounded_attribute"
path = "fuzz_targets/bounded_attribute.rs"
test = false
doc = false

[[bin]]
name = "der_name"
path = "fuzz_targets/der_name.rs"
test = false
doc = false

[[bin]]
name = "url_redact"
path = "fuzz_targets/url_redact.rs"
test = false
doc = false
