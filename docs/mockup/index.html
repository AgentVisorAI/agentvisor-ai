<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    Static redirect stub. GitHub Pages ignores the Cloudflare-style
    _redirects file, so short links are implemented as tiny pages
    with an instant meta refresh + canonical.
  -->
  <meta http-equiv="refresh" content="0; url=/pitch/">
  <link rel="canonical" href="https://agentvisorai.me/pitch/">
  <title>AgentVisor AI mockup demo</title>
  <meta name="robots" content="noindex">
</head>
<body>
  <p>Redirecting to the demo: <a href="/pitch/">agentvisorai.me/pitch/</a></p>
</body>
</html>
