<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    Static redirect stub. GitHub Pages ignores the Cloudflare-style
    _redirects file, so short links are implemented as tiny pages
    with an instant meta refresh + canonical.

    /mockup -> /pitch/ (the story: videos + transcripts + QR)
    /demo   -> /app/   (the live console Vadim presents from,
                        landing directly in the demo workspace)
  -->
  <meta http-equiv="refresh" content="0; url=/app/">
  <link rel="canonical" href="https://agentvisorai.me/app/">
  <title>AgentVisor AI live demo</title>
  <meta name="robots" content="noindex">
</head>
<body>
  <p>Redirecting to the live demo console: <a href="/app/">agentvisorai.me/app/</a></p>
</body>
</html>
