# AgentVisor AI single-container configuration.
#
# Used by docker/docker-compose.minimal.yml: no external services, embedded
# event bridge, in-memory state, hash embedder. Ships receipts, OCSF events,
# loop detection, and budget enforcement out of the box.
#
# Environment overrides (set with `docker run -e ...`):
#   AV_UPSTREAM_URL       provider base URL (default below: Ollama on the host)
#   AV_UPSTREAM_API_KEY   API key value; presence selects it as the key source
#   AV_UPSTREAM_KEY_FILE  path to a mounted secret file holding the key
#                         (Docker/Kubernetes secrets; must be mode 0600)
#   AV_UPSTREAM_CHAT_PATH provider chat path when not /v1/chat/completions
#   AV_LISTEN             listen address

config_version = 1
listen = "0.0.0.0:8484"

# Default upstream: Ollama running on the Docker host.
# Override with AV_UPSTREAM_URL, e.g. https://api.openai.com plus
# AV_UPSTREAM_API_KEY=sk-... for a cloud provider.
upstream_url = "http://host.docker.internal:11434"
upstream_read_timeout_s = 300

# Dev-mode identity: any client may talk to the proxy. In production set
# require_identity = true and configure identity_jwks_url or
# identity_hmac_secret_file (see config/harness.docker.toml).
require_identity = false
# Container's outer network layer (docker-compose port map, K8s Service +
# NetworkPolicy) controls who reaches the listener; the 0.0.0.0 bind above
# is the *container-internal* interface, not host-visible. See
# config/harness.example.toml for the bare-metal / laptop posture.
allow_wildcard_bind = true

default_workflow = "unsigned"
consequential_tools = ["db_write", "payout", "merge", "deploy"]

# All paths below exist inside the published image.
atif_spool_dir = "/app/spool/atif"
bridge_data_dir = "/app/data/bridge"
bridge_backend = "embedded"
bridge_manifest_path = "/app/manifests/bridge.example.yaml"
tool_schema_dir = "/app/config/tool-schemas"
wasm_policy_paths = ["/app/config/policies/payload_limit.wat"]

state_backend = "memory"
embedder_backend = "hash"
vector_backend = "memory"

session_idle_close_s = 900
worker_channel_capacity = 32768
compression_enabled = true
reconcile_tick_s = 5

[breaker]
delta_epsilon = 0.30
window = 3
min_tokens = 1000
action = "reject"

[budget]
max_tokens = 200000
max_payout_usd_micros = 50000000
max_total_tool_calls = 100
