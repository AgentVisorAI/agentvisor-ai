config_version = 1
listen = "0.0.0.0:8484"
upstream_url = "http://host.docker.internal:4000"
upstream_http2_prior_knowledge = false
upstream_read_timeout_s = 300

# --- Upstream authentication (see README "Upstream authentication") ---
# Provider chat endpoint path; Azure/Gemini use non-default paths.
# upstream_chat_path = "/v1/chat/completions"
# API key source: an environment variable name OR a 0600 file (not both).
# upstream_api_key_env = "OPENAI_API_KEY"
# upstream_api_key_file = "/run/secrets/upstream_api_key"
# Header + scheme the key is sent with. Azure: "api-key" + "" (raw).
# upstream_auth_header = "authorization"
# upstream_auth_scheme = "Bearer"
# Relay each client's own Authorization header instead of a static key
# (mutually exclusive with the static key and require_identity):
# upstream_authorization_passthrough = true

# tool_upstream_url = "http://host.docker.internal:3000/mcp"
# Bearer token injected on forwarded MCP tool calls:
# tool_upstream_bearer_env = "MCP_TOKEN"
# tool_upstream_bearer_file = "/run/secrets/mcp_token"

require_identity = false
audience = "agentvisor-ai"
default_workflow = "unsigned"
consequential_tools = ["db_write", "payout", "merge", "deploy"]
session_idle_close_s = 900
atif_spool_dir = "spool/atif"
bridge_data_dir = "data/bridge"
worker_channel_capacity = 32768
strict_stage_budget = false
compression_enabled = true
reconcile_tick_s = 5

# Read-only operator dashboard served at /dashboard. Unauthenticated —
# front the harness with the same ingress control you use for /metrics.
dashboard_enabled = true

[breaker]
delta_epsilon = 0.30
window = 3
min_tokens = 1000
action = "reject"

[budget]
max_tokens = 200000
max_payout_usd_micros = 50000000
max_total_tool_calls = 100

[budget.max_tool_calls]
db_write = 3
payout = 10
