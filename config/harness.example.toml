config_version = 1
# Bind to loopback by default. Override to a routable interface only when
# you also enable `require_identity = true` OR keep the whole harness
# behind an authenticated ingress. Compose/K8s manifests can flip this via
# `AV_LISTEN` or the config override chain.
listen = "127.0.0.1:8484"
upstream_url = "http://host.docker.internal:4000"
upstream_http2_prior_knowledge = false
upstream_read_timeout_s = 300
# Graceful-shutdown drain budget. Unset, it derives as
# max(30, upstream_read_timeout_s + 5) so a single in-flight request
# cannot outlive the drain window. Set explicitly when your orchestrator
# enforces a shorter grace period (K8s terminationGracePeriodSeconds,
# docker stop --time).
#shutdown_drain_timeout_s = 110

# --- Upstream authentication (see README "Upstream authentication") ---
# Provider chat endpoint path; Azure/Gemini use non-default paths.
# upstream_chat_path = "/v1/chat/completions"
# API key source: an environment variable name OR a 0600 file (not both).
# upstream_api_key_env = "OPENAI_API_KEY"
# upstream_api_key_file = "/run/secrets/upstream_api_key"
# Header + scheme the key is sent with. Azure: "api-key" + "" (raw).
# upstream_auth_header = "authorization"
# upstream_auth_scheme = "Bearer"
# Relay each client's own Authorization header instead of a static key
# (mutually exclusive with the static key and require_identity):
# upstream_authorization_passthrough = true
# KEYLESS upstreams (Ollama, LM Studio, vLLM, llama.cpp): OpenAI SDKs
# unconditionally send a placeholder Authorization header, and with no
# static key configured the harness refuses it — request 1 fails with
# 401. This flag accepts and DISCARDS the placeholder (it is never
# forwarded). With a static key above, the same posture is implicit
# and this flag is unnecessary.
# ignore_client_authorization = true

# tool_upstream_url = "http://host.docker.internal:3000/mcp"
# Bearer token injected on forwarded MCP tool calls:
# tool_upstream_bearer_env = "MCP_TOKEN"
# tool_upstream_bearer_file = "/run/secrets/mcp_token"

require_identity = false
audience = "agentvisor-ai"
# "signed" is the product's core promise (every session close mints an
# Ed25519 receipt). The serde default is "unsigned" for zero-config
# ergonomics, but every SHIPPED config opts into signed — matching
# `avctl init` and the README's headline claim. Clients can still
# override per request via X-AV-Workflow.
default_workflow = "signed"
consequential_tools = ["db_write", "payout", "merge", "deploy"]
session_idle_close_s = 900
atif_spool_dir = "spool/atif"
bridge_data_dir = "data/bridge"
worker_channel_capacity = 32768
strict_stage_budget = false
compression_enabled = true
reconcile_tick_s = 5

# Read-only operator dashboard served at /dashboard. Unauthenticated —
# front the harness with the same ingress control you use for /metrics.
# Off in the example so a fresh checkout does not expose it to anyone
# reachable on the listen interface.
dashboard_enabled = false

[breaker]
delta_epsilon = 0.30
window = 3
min_tokens = 1000
action = "reject"

[budget]
max_tokens = 200000
max_payout_usd_micros = 50000000
max_total_tool_calls = 100

[budget.max_tool_calls]
db_write = 3
payout = 10
