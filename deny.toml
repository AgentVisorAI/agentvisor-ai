[advisories]
version = 2
yanked = "deny"
# `unmaintained = "workspace"` still surfaces unmaintained *direct*
# dependencies as errors but tolerates transitive maintenance debt that our
# own upgrades cannot resolve (e.g. `paste` reached via wasmtime and
# `number_prefix` reached via tokenizers -> indicatif). Real security
# advisories still fail the check.
unmaintained = "workspace"
# Round-44 F5: RUSTSEC-2023-0071 (Marvin Attack on `rsa` 0.9.x) is
# UNREACHABLE from our runtime. The vulnerability is a timing side
# channel in RSA private-key operations. `rsa` is pulled in transitively
# via `jsonwebtoken`'s `rust_crypto` feature (jsonwebtoken 10.4 makes
# this feature monolithic — no way to opt out of `rsa` while keeping
# ed25519+hmac).
#
# Our JWT validator at crates/ab-identity/src/validator.rs:395-413
# whitelists exactly two algorithms — `Algorithm::EdDSA` (for Ed25519
# key material) and `Algorithm::HS256` (for HMAC secrets) — and
# explicitly rejects any other `alg` header BEFORE calling
# `jsonwebtoken::decode`. `Validation::new(expected_alg)` further pins
# the decoder to the whitelisted alg. A malicious JWT claiming
# `alg: RS256` therefore never reaches the RSA code path.
#
# The workspace has no other `rsa`-crate consumers (grep confirms zero
# `use rsa` and zero `Algorithm::RS*` sites). No safe upgrade of the
# `rsa` crate is available upstream; RustCrypto's tracking issue is
# https://github.com/RustCrypto/RSA/issues/626 . Revisit if either
# (a) jsonwebtoken splits the `rust_crypto` feature so we can drop
# `rsa`, or (b) an RSA-fixed release ships.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa crate is a transitive dep of jsonwebtoken's rust_crypto feature; our JWT validator whitelists only EdDSA and HS256 and rejects other algs before decoding, so the RSA timing side-channel code path is unreachable at runtime" },
]

[licenses]
version = 2
# All entries are OSI-approved or SPDX-recognised permissive licenses used by
# transitive dependencies. Add new licenses only after review.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    # webpki-roots (Mozilla CA bundle) publishes under CDLA-Permissive-2.0.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace uses internal `path = "..."` dependencies which cargo-deny
# reports as wildcard versions. External wildcard dependencies remain denied.
allow-wildcard-paths = true
# Round-32 F6: fail closed on obvious foot-guns even before an advisory
# exists. `openssl` is banned because the workspace is intentionally
# rustls-only (round-13 hardening); a stray transitive that pulls in
# `openssl` is a new TLS surface we must review, not adopt silently.
# `git2` catches an accidental runtime-git dependency; if a build tool
# ever needs it, add it explicitly here with a rationale.
deny = [
    { name = "openssl", reason = "workspace is rustls-only; a stray openssl import is a new TLS surface" },
    { name = "openssl-sys", reason = "same; catches transitive openssl pull-ins at the sys-crate layer" },
    { name = "git2", reason = "no runtime git dependency wanted; catches accidental introduction" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
