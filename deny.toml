[advisories]
version = 2
yanked = "deny"
# `unmaintained = "workspace"` still surfaces unmaintained *direct*
# dependencies as errors but tolerates transitive maintenance debt that our
# own upgrades cannot resolve (e.g. `paste` reached via wasmtime and
# `number_prefix` reached via tokenizers -> indicatif). Real security
# advisories still fail the check.
unmaintained = "workspace"

[licenses]
version = 2
# All entries are OSI-approved or SPDX-recognised permissive licenses used by
# transitive dependencies. Add new licenses only after review.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    # webpki-roots (Mozilla CA bundle) publishes under CDLA-Permissive-2.0.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace uses internal `path = "..."` dependencies which cargo-deny
# reports as wildcard versions. External wildcard dependencies remain denied.
allow-wildcard-paths = true
# Round-32 F6: fail closed on obvious foot-guns even before an advisory
# exists. `openssl` is banned because the workspace is intentionally
# rustls-only (round-13 hardening); a stray transitive that pulls in
# `openssl` is a new TLS surface we must review, not adopt silently.
# `git2` catches an accidental runtime-git dependency; if a build tool
# ever needs it, add it explicitly here with a rationale.
deny = [
    { name = "openssl", reason = "workspace is rustls-only; a stray openssl import is a new TLS surface" },
    { name = "openssl-sys", reason = "same; catches transitive openssl pull-ins at the sys-crate layer" },
    { name = "git2", reason = "no runtime git dependency wanted; catches accidental introduction" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
