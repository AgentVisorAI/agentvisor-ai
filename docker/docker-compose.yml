services:
  agent-bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: agent-bridge:local
    container_name: agent-bridge
    ports:
      - "8484:8484"
    environment:
      RUST_LOG: info
      AB_CONFIG: /app/config/harness.docker.toml
      AB_SIGNING_SEED_FILE: /app/data/signing.seed
      OTEL_EXPORTER_OTLP_ENDPOINT: http://vector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    volumes:
      - bridge-data:/app/data
      - atif-spool:/app/spool
    secrets:
      - identity_hmac
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "abctl", "health"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  redpanda:
    image: redpandadata/redpanda:v25.2.5
    # Internal-only: Kafka is consumed via the compose network as
    # `redpanda:9092`. Binding to 127.0.0.1 keeps the external listener
    # reachable for a local `rpk` on the host without exposing it to the
    # host's network interfaces.
    ports:
      - "127.0.0.1:19092:19092"
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy:[[:space:]]+true'"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8.2.1-alpine
    # Internal-only: state store is consumed via `redis://redis:6379` on the
    # compose network. Localhost binding keeps `redis-cli` on the host
    # working without publishing an unauthenticated Redis to the world.
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.15.4
    # Internal-only vector DB (see redpanda note above).
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12

  nats:
    image: nats:2.11-alpine
    # Internal-only JetStream bus.
    ports:
      - "127.0.0.1:4222:4222"
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  vector:
    image: timberio/vector:0.48.0-debian
    # Internal-only OTLP receivers; agent-bridge sends via the compose network.
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./vector.toml:/etc/vector/vector.toml:ro
      # NOTE: mounting the docker socket even read-only lets Vector enumerate
      # every container's env vars via the docker API. Keep the socket out
      # of production; switch this source to `journald` or `file` and use
      # a docker-socket-proxy if you truly need container discovery.
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  bridge-data:
  atif-spool:
  qdrant-data:
  redis-data:

secrets:
  identity_hmac:
    external: true
